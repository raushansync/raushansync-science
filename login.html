<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6" id="theme-color-meta">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-store, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Login - RaushanSync Science</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">

    <style>
        :root {
            --header-height: 70px;
        }

        main {
            padding-top: calc(var(--header-height) + 40px);
            padding-bottom: 4rem;
        }

        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--header-height) - 60px);
            padding: 2rem 0;
        }

        .auth-card {
            background-color: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 420px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .auth-header p {
            color: var(--secondary-text-color);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            color: var(--text-color);
            font-weight: 500;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s, box-shadow 0.3s;
            background-color: var(--card-background);
            color: var(--text-color);
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        input::placeholder {
            color: var(--secondary-text-color);
        }

        input:disabled {
            background-color: rgba(0, 0, 0, 0.04);
            cursor: not-allowed;
        }

        .dark-mode input:disabled {
            background-color: rgba(255, 255, 255, 0.04);
        }

        button {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.2s, transform 0.15s;
            margin-bottom: 1rem;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-color-dark, var(--primary-color));
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .dark-mode .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .error.show {
            display: block;
        }

        .success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #16a34a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .dark-mode .success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .success.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--primary-color);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .loading.show {
            display: block;
        }

        .divider {
            text-align: center;
            color: var(--secondary-text-color);
            font-size: 0.85rem;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            position: relative;
            background: var(--card-background);
            padding: 0 0.75rem;
        }

        .signup-link {
            text-align: center;
            color: var(--secondary-text-color);
            font-size: 0.9rem;
        }

        .signup-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .signup-link a:hover {
            color: var(--primary-color-dark, var(--primary-color));
            text-decoration: underline;
        }

        .redirect-info {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid var(--primary-color);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--secondary-text-color);
            margin-bottom: 1.25rem;
            display: none;
        }

        .dark-mode .redirect-info {
            background: rgba(96, 165, 250, 0.1);
        }

        .redirect-info.show {
            display: block;
        }

        @media (max-width: 768px) {
            main {
                padding-top: calc(var(--header-height) + 20px);
            }

            .auth-card {
                padding: 2rem;
                border-radius: 12px;
            }

            .auth-header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            main {
                padding-right: var(--container-padding);
                padding-left: var(--container-padding);
            }

            .auth-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="/" class="logo">RaushanSYNC Science</a>
            <div id="nav"></div>
            <div class="header-actions">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode">
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                    </svg>
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                    </svg>
                </button>
                <button class="hamburger" id="hamburger" aria-label="Open menu">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Welcome Back</h1>
                        <p>Sign in to your account to continue</p>
                    </div>

                    <div class="redirect-info" id="redirectInfo"></div>
                    <div class="error" id="errorMessage" role="alert" aria-live="polite"></div>
                    <div class="success" id="successMessage" role="status" aria-live="polite"></div>
                    <div class="loading" id="loading">Please wait...</div>

                    <form id="loginForm">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="your@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="��������" required>
                        </div>

                        <button type="submit" id="loginBtn">Sign In</button>
                    </form>

                    <div class="divider">
                        <span>New to RaushanSYNC?</span>
                    </div>

                    <div class="signup-link">
                        Don't have an account? <a href="/signup.html">Sign up here</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="/assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
    <script src="/assets/js/auth-config.js"></script>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const errorDiv = document.getElementById("errorMessage");
            const loadingDiv = document.getElementById("loading");
            const loginBtn = document.getElementById("loginBtn");

            if (!email || !password) {
                errorDiv.textContent = "Please fill in all fields.";
                errorDiv.classList.add("show");
                return;
            }

            if (!window.supabaseClient) {
                errorDiv.textContent = "Authentication service unavailable.";
                errorDiv.classList.add("show");
                return;
            }

            loginBtn.disabled = true;
            loadingDiv.classList.add("show");
            errorDiv.classList.remove("show");

            try {
                const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    errorDiv.textContent = error.message || "Login failed. Please try again.";
                    errorDiv.classList.add("show");
                    loginBtn.disabled = false;
                    loadingDiv.classList.remove("show");
                    return;
                }

                if (data.session) {
                    window.location.replace("/dashboard.html");
                }
            } catch (err) {
                errorDiv.textContent = "An error occurred. Please try again.";
                errorDiv.classList.add("show");
                loginBtn.disabled = false;
                loadingDiv.classList.remove("show");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", handleLogin);

        window.addEventListener("load", () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("message") === "signed-out") {
                document.getElementById("redirectInfo").textContent = "You have been signed out successfully.";
                document.getElementById("redirectInfo").classList.add("show");
            }
        });
    </script>
</body>
</html>
